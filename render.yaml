# Ishlab chiqarish muhiti: Render Docker web service, Neon bazasi URL orqali ulanadi.
# Maxfiy qiymatlar Render boshqaruv panelida saqlanadi va repoga yozilmaydi.
services:
  - type: web
    name: ritm-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false        # Render dashboard qiymati Neon Postgres'ga ulanadi
      - key: TELEGRAM_MODE
        value: webhook
      - key: HEALTH_PORT
        value: "0"        # Tekshiruv $PORT orqali /health manzilida ishlaydi
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_CARD_TYPE
        sync: false
      - key: PAYMENT_CARD2_NUMBER
        sync: false
      - key: PAYMENT_CARD2_HOLDER
        sync: false
      - key: PAYMENT_CARD2_TYPE
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false       # Ixtiyoriy maxsus domen; odatda RENDER_EXTERNAL_URL ishlatiladi
