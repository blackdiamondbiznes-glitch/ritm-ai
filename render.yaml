# Render Blueprint for Ritm AI: one Docker web service (bot + Mini App + health on $PORT)
# and one Postgres. Secrets are declared with `sync: false` and set in the dashboard/API,
# never committed. Start with TELEGRAM_MODE=off; switch to webhook at cutover.
services:
  - type: web
    name: ritm-ai
    runtime: docker
    plan: free            # production: starter ($7/mo) so it never sleeps
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ritm-ai-db
          property: connectionString
      - key: TELEGRAM_MODE
        value: "off"      # off -> webhook at cutover (polling only for local Docker)
      - key: HEALTH_PORT
        value: "0"        # health is served on $PORT at /health
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_CARD_TYPE
        sync: false
      - key: PAYMENT_CARD2_NUMBER
        sync: false
      - key: PAYMENT_CARD2_HOLDER
        sync: false
      - key: PAYMENT_CARD2_TYPE
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false       # optional: custom domain; defaults to RENDER_EXTERNAL_URL

databases:
  - name: ritm-ai-db
    plan: free            # expires after 30 days; production: basic-256mb ($6/mo)
    region: frankfurt
    databaseName: ritm
    user: ritm
    postgresMajorVersion: "16"
