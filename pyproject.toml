[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: process wiring without Telegram polling",
    "e2e: browser-based panel layout checks",
]
