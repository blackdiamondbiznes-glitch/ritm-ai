  <div id="boot" class="boot" role="status">
    <div class="boot-mark">Ritm</div>
    <p>Ritm AI</p>
  </div>
  <div id="topbar" class="topbar" aria-hidden="true"></div>
  <div class="shell">
    <main id="main" class="main">
      <div class="header sk-header"><div class="sk" style="width:55%;height:26px"></div><div class="sk" style="width:75%;height:14px"></div></div>
      <div class="card sk-card"><div class="sk" style="width:40%;height:14px"></div><div class="sk" style="height:96px;margin-top:12px"></div></div>
      <div class="card sk-card"><div class="sk" style="width:30%;height:14px"></div><div class="sk" style="width:60%;height:26px"></div></div>
    </main>
    <nav id="nav" class="bottom">
      <button type="button" class="nav-item" data-tab="cabinet" hidden>
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-cap"></use></svg>
        <span data-i18n="navCab">Kabinet</span>
      </button>
      <button type="button" class="nav-item" data-tab="study" hidden>
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-home"></use></svg>
        <span data-i18n="navToday">Bosh</span>
      </button>
      <button type="button" class="nav-item" data-tab="agenda" hidden>
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg>
        <span data-i18n="navAgenda">Darslar</span>
      </button>
      <button type="button" class="nav-item" data-tab="home">
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-home"></use></svg>
        <span data-i18n="navHome">Bosh sahifa</span>
      </button>
      <button type="button" class="nav-item" data-tab="chats">
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-chat"></use></svg>
        <span data-i18n="navChats">Chatlar</span>
      </button>
      <button type="button" class="nav-item" data-tab="board">
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-trophy"></use></svg>
        <span data-i18n="navBoard">Reyting</span>
      </button>
      <button type="button" class="nav-item" data-tab="history" hidden>
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-history"></use></svg>
        <span data-i18n="navHistory">Tarix</span>
      </button>
      <button type="button" class="nav-item" data-tab="report">
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-chart"></use></svg>
        <span data-i18n="navReport">Chat statistikasi</span>
      </button>
      <button type="button" class="nav-item" data-tab="admin" hidden>
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-shield"></use></svg>
        <span data-i18n="navAdmin">Admin</span>
      </button>
      <button type="button" class="nav-item" data-tab="profile">
        <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg>
        <span data-i18n="navProfile">Profil</span>
      </button>
    </nav>
  </div>
  <script type="module" src="/s/app.js"></script>

</html>
