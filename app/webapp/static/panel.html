<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Ritm · Panel</title>
  <link rel="stylesheet" href="/s/theme.css">

  <link rel="modulepreload" href="/s/panel.js">
  <link rel="modulepreload" href="/s/i18n.js">
  <link rel="modulepreload" href="/s/panel_kit.js">
  <link rel="modulepreload" href="/s/panel_schedule.js">

  <link rel="modulepreload" href="/s/panel_money.js">

</head>
<body class="pn">
  <svg class="pn-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a7 7 0 0 1 4 6.5"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol><symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol><symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol></svg>
  <a class="pn-skip" href="#pn-main" data-i18n="pnlSkip">Asosiy qismga o‘tish</a>
  <div class="pn-shell">
    <aside class="pn-side" id="pn-side" aria-label="Ritm">
      <div class="pn-brand"><span class="pn-logo" aria-hidden="true">R</span>Ritm</div>
      <nav class="pn-nav" id="pn-nav">
        <a href="#/home" data-route="home"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg><span data-i18n="pnlHome">Bosh</span></a>
        <a href="#/schedule" data-route="schedule"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg><span data-i18n="pnlSchedule">Jadval</span></a>
        <a href="#/groups" data-route="groups"><svg class="ic" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="pnlGroups">Guruhlar</span></a>
        <a href="#/students" data-route="students"><svg class="ic" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="pnlStudents">O‘quvchilar</span></a>
        <a href="#/attendance" data-route="attendance"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><span data-i18n="pnlAttendance">Davomat</span></a>
        <a href="#/fees" data-route="fees"><svg class="ic" aria-hidden="true"><use href="#i-card"></use></svg><span data-i18n="pnlFees">To‘lovlar</span></a>
        <a href="#/reports" data-route="reports"><svg class="ic" aria-hidden="true"><use href="#i-chart"></use></svg><span data-i18n="pnlReports">Hisobotlar</span></a>
        <a href="#/settings" data-route="settings"><svg class="ic" aria-hidden="true"><use href="#i-gear"></use></svg><span data-i18n="pnlSettings">Sozlamalar</span></a>
      </nav>
      <div class="pn-side-foot">
        <div class="pn-switch" id="pn-switch" hidden>
          <p data-i18n="pnlBoth">Bu hisobda o‘qituvchi va o‘quvchi rollari bor</p>
          <a href="/?role=student#/study" data-i18n="pnlToStudent">O‘quvchi ilovasiga o‘tish</a>
        </div>
        <div class="pn-me">
          <span class="pn-avatar" id="pn-avatar" aria-hidden="true"></span>
          <span class="pn-me-text"><b id="pn-name"></b><small data-i18n="pnlRole">O‘qituvchi</small></span>
          <form method="post" action="/panel/logout"><button type="submit" class="pn-icon-btn" data-i18n-label="pnlLogout" aria-label="Chiqish"><svg class="ic" aria-hidden="true"><use href="#i-logout"></use></svg></button></form>
        </div>
      </div>
    </aside>
    <div class="pn-scrim" id="pn-scrim" hidden></div>
    <main class="pn-main" id="pn-main" tabindex="-1">
      <div class="pn-loading" role="status" data-i18n="loading">Yuklanmoqda…</div>
    </main>
  </div>
  <script type="module" src="/s/panel.js"></script>
</body>
</html>
