<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;padding:10px 12px 14px;font-family:system-ui,sans-serif;font-size:var(--tg-text-font-size,15px);line-height:var(--tg-text-line-height,1.35);color:var(--tg-theme-text-color)}
h1{font-size:1.05em;margin:0 0 4px;font-weight:650}
.m,.h{color:var(--tg-theme-hint-color);font-size:.9em;margin:2px 0}
.v{margin:2px 0}
.bad{color:var(--tg-theme-destructive-text-color)}
.ok{color:var(--tg-theme-accent-text-color,#31b545)}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1}
#msg{min-height:1.2em;margin-top:6px}
#hw{white-space:pre-wrap;margin:6px 0}</style></head><body>
<h1 id="t"></h1><div class="m" id="sub"></div><div class="v" id="when"></div>
<div id="hwbox" hidden><div class="h" id="hwl"></div><div id="hw"></div><div class="m" id="due"></div></div>
<div class="m" id="empty"></div><div class="row"><button type="button" id="copy" hidden></button></div>
<div class="h" id="msg"></div>
<script>
const W=window.TelegramWidget;
function data(){try{return JSON.parse(W&&W.chatData||"{}")}catch(e){return {}}}
function $(id){return document.getElementById(id)}
function ask(d,fn){if(!W)return;const m=$("msg");if(m)m.textContent="…";W.request(d).then(a=>{if(fn)fn(a&&a.result);},e=>{if(m)m.textContent=(e&&e.code)||"err";});}
const I={uz:{hw:"Uy vazifasi",none:"Hali dars yo‘q",nohw:"Uy vazifasi yo‘q",copy:"Nusxalash",due:"Muddat"},ru:{hw:"Домашнее задание",none:"Пока нет урока",nohw:"Задания нет",copy:"Копировать",due:"Срок"},en:{hw:"Homework",none:"No lesson yet",nohw:"No homework",copy:"Copy",due:"Due"}};
function L(d){return I[d.l]||I.uz}
function draw(){
  const d=data(),x=L(d);
  $("t").textContent=d.g||"";
  $("sub").textContent=d.w||"";
  $("when").textContent=d.when||"";
  $("hwl").textContent=x.hw;
  if(d.hw){$("hwbox").hidden=false;$("hw").textContent=d.hw;$("due").textContent=d.due?(x.due+": "+d.due):"";$("copy").hidden=false;$("copy").textContent=x.copy;$("empty").textContent="";}
  else{$("hwbox").hidden=true;$("copy").hidden=true;$("empty").textContent=d.when?x.nohw:x.none;}
  if(W&&W.ready)W.ready();
}
$("copy").onclick=()=>{const d=data();if(W&&d.hw&&W.copyText)W.copyText(d.hw);};
if(W&&W.onEvent)W.onEvent("chatDataChanged",draw);
draw();
</script></body></html>
